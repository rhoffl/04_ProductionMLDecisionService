[project]
name = "production-ml-decision-service"
version = "1.0.0"
description = "Auditable churn decision service with business-aware thresholding and MLOps controls"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
  "scikit-learn>=1.6,<2",
  "joblib>=1.4,<2",
  "mlflow>=2.16,<4",
  "shap>=0.46,<1",
  "psycopg[binary]>=3.2,<4",
  "prometheus-client>=0.21,<1",
  "apscheduler>=3.10,<4",
  "httpx>=0.27,<1"
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "ml*", "monitoring*", "orchestration*", "scripts*"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.8,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
